<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ride Rush - Fare Prediction Project</title>
<style>
  :root{
    --navy:#1E3A5F;
    --navy-active:#3D6FA8;
    --sidebar-muted:#8098B3;
    --bg:#F4F6F8;
    --white:#FFFFFF;
    --ink:#1B2733;
    --border:#D7DEE5;
    --header-bg:#E9EFF6;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .topbar{
    background:var(--navy);
    color:white;
    padding:18px 28px;
    font-size:20px;
    font-weight:700;
    border-bottom:3px solid #16283F;
  }
  .layout{
    display:flex;
    min-height:calc(100vh - 62px);
  }
  .sidebar{
    width:190px;
    background:var(--navy);
    padding:14px 0;
    flex-shrink:0;
  }
  .sidebar a, .sidebar .soon{
    display:block;
    padding:14px 22px;
    color:#E4EAF1;
    text-decoration:none;
    font-size:15px;
  }
  .sidebar a.active{
    background:var(--navy-active);
    color:white;
    font-weight:700;
  }
  .sidebar a:hover:not(.active){
    background:#274A73;
  }
  .sidebar .soon{
    color:var(--sidebar-muted);
    font-size:13px;
    line-height:1.4;
    padding-top:14px;
    padding-bottom:14px;
  }
  .content{
    flex:1;
    padding:36px 44px;
  }
  .content h1{
    font-size:26px;
    margin:0 0 22px;
    color:var(--ink);
  }
  .content h2{
    font-size:18px;
    margin:32px 0 12px;
    color:var(--ink);
  }
  table{
    border-collapse:collapse;
    background:var(--white);
    border:1px solid var(--border);
  }
  th, td{
    border:1px solid var(--border);
    padding:10px 16px;
    text-align:left;
    font-size:14px;
  }
  th{
    background:var(--header-bg);
    font-weight:700;
  }
  .stat-table td:first-child{
    font-weight:600;
    background:var(--header-bg);
    width:160px;
  }
  .wide-table{ width:100%; max-width:900px; }
  .small-table{ width:auto; }

  .error{
    background:#FDECEC;
    border:1px solid #F3B4B4;
    color:#8A1F1F;
    padding:16px 18px;
    border-radius:6px;
    max-width:700px;
  }
  code{
    background:var(--navy);
    color:#F3C13A;
    padding:2px 6px;
    border-radius:4px;
    font-size:12px;
  }

  .charts-section img{
    display:block;
    width:100%;
    max-width:900px;
    border:1px solid var(--border);
    background:white;
    margin-bottom:20px;
  }
  .chart-caption{
    font-size:12px;
    color:#6B7A8A;
    margin:-14px 0 20px;
  }
</style>
</head>
<body>

<div class="topbar">Ride Rush &mdash; Fare Prediction Project</div>

<div class="layout">
  <div class="sidebar">
    <a href="/data-loading" class="{{ 'active' if active == 'data-loading' else '' }}">Data Loading</a>
    <a href="/eda" class="{{ 'active' if active == 'eda' else '' }}">EDA</a>
    <div class="soon">Preprocessing<br>(coming soon)</div>
    <div class="soon">Model Training<br>(coming soon)</div>
    <div class="soon">Prediction<br>(coming soon)</div>
  </div>

  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>
